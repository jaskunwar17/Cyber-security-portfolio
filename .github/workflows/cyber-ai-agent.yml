name: Cyber AI Agent tests
on:
  push:
    paths: ['cyber-ai-agent/**', '.github/workflows/cyber-ai-agent.yml']
  pull_request:
    paths: ['cyber-ai-agent/**', '.github/workflows/cyber-ai-agent.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
        working-directory: cyber-ai-agent
